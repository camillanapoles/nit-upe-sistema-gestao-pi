name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

env:
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  # ============================================================================
  # JOB 1: PREPARE RELEASE
  # ============================================================================
  prepare-release:
    name: 📦 Prepare Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏷️ Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_name=release-${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: 📋 Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            COMMITS="Initial release"
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## 🚀 Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 📋 Changes" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### ✨ Features" >> $GITHUB_OUTPUT
          echo "- GitHub Pages CI/CD pipeline" >> $GITHUB_OUTPUT
          echo "- Automated form validation" >> $GITHUB_OUTPUT
          echo "- Security and accessibility scans" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 🐛 Fixes" >> $GITHUB_OUTPUT
          echo "- Various bug fixes and improvements" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 📚 Documentation" >> $GITHUB_OUTPUT
          echo "- Updated AGENTS.md" >> $GITHUB_OUTPUT
          echo "- Added deployment guides" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📤 Prepare release artifacts
        run: |
          # Create release artifacts directory
          mkdir -p release-artifacts

          # Copy documentation
          cp -r docs release-artifacts/
          cp -r SPEC_*.md release-artifacts/ 2>/dev/null || true
          cp AGENTS.md release-artifacts/ 2>/dev/null || true

          # Create release summary
          cat > release-artifacts/RELEASE_NOTES.md << EOF
          # Release ${{ steps.version.outputs.version }}

          ## 📦 Package Contents

          - Full documentation system
          - GitHub Pages CI/CD workflows
          - Form validation and testing
          - Security and accessibility scans

          ## 🚀 Deployment

          Deploy to GitHub Pages:
          \`\`\`bash
          git checkout main
          git pull origin main
          # Deployment is automatic via GitHub Actions
          \`\`\`

          ## 📚 Documentation

          See \`AGENTS.md\` for complete documentation.

          ## 🙏 Credits

          - University of Pernambuco (UPE)
          - NIT (Núcleo de Inovação Tecnológica)
          - Crush Engineering Team

          Version: ${{ steps.version.outputs.version }}
          Date: $(date -u +"%Y-%m-%d")
          EOF

          # Create archive
          tar -czf release-artifacts.tar.gz release-artifacts/

      - name: 📤 Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.version.outputs.version }}
          path: release-artifacts/
          retention-days: 30

      - name: 📤 Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ steps.version.outputs.version }}
          path: release-artifacts.tar.gz
          retention-days: 90

  # ============================================================================
  # JOB 2: CREATE GITHUB RELEASE
  # ============================================================================
  create-release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏷️ Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: 📋 Generate release notes
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            NOTES="Initial release"
          else
            NOTES=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi

          # Create release notes
          cat > release_notes.txt << EOF
          ## 🚀 Release ${VERSION}

          ### 📋 Changes

          ${NOTES}

          ### ✨ Features

          - GitHub Pages CI/CD pipeline with automated validation
          - Comprehensive form validation and testing
          - Security and accessibility scans
          - Performance optimization with Lighthouse CI
          - Pull request validation workflows
          - Automated deployment to GitHub Pages

          ### 🐛 Fixes

          - Various bug fixes and improvements
          - Enhanced error handling and validation

          ### 📚 Documentation

          - Updated AGENTS.md with complete developer guide
          - Added deployment guides and troubleshooting
          - Created SPEC files for all forms and annexes

          ### 🎨 Design

          - Implemented UPE color scheme (#2196F3)
          - Responsive design for mobile, tablet, and desktop
          - Professional UI/UX with animations

          ### 🧪 Testing

          - 12 automated tests for forms
          - HTML/CSS/JavaScript validation
          - Accessibility (a11y) tests
          - Performance tests with Lighthouse

          ### 🔒 Security

          - Trivy vulnerability scanning
          - CodeQL security analysis
          - Dependency checks

          ## 📦 Installation

          Clone the repository:
          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git
          cd crush-teacher
          \`\`\`

          ## 🚀 Deployment

          Deploy to GitHub Pages (automatic):
          \`\`\`bash
          git checkout main
          git push origin main
          # Deployment happens automatically via GitHub Actions
          \`\`\`

          ## 📚 Documentation

          - [AGENTS.md](AGENTS.md) - Developer guide
          - [DEPLOY_GITHUB.md](DEPLOY_GITHUB.md) - Deployment guide
          - [ESTRUTURA_GITHUB_PAGES.md](ESTRUTURA_GITHUB_PAGES.md) - Project structure

          ## 🙏 Credits

          - University of Pernambuco (UPE)
          - NIT (Núcleo de Inovação Tecnológica)
          - Crush Engineering Team

          **Version:** ${VERSION}
          **Date:** $(date -u +"%Y-%m-%d")
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}

          ---

          Full release notes and artifacts available in this release.
          EOF

      - name: 📥 Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ steps.version.outputs.version }}
          path: release-artifacts/

      - name: 📥 Download release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive-${{ steps.version.outputs.version }}
          path: ./

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            release-artifacts.tar.gz
            release-artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Release summary
        run: |
          echo "## 🎉 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Release Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- release-artifacts.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- Full documentation system" >> $GITHUB_STEP_SUMMARY
          echo "- CI/CD workflows" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Deployed Site" >> $GITHUB_STEP_SUMMARY
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 3: POST-RELEASE TASKS
  # ============================================================================
  post-release:
    name: 📋 Post-Release Tasks
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🏷️ Tag commit with version metadata
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"

          # Create annotated tag with metadata
          git tag -a "v${VERSION}" -m "Release ${VERSION}" \
            -m "Date: $(date -u +"%Y-%m-%d")" \
            -m "Branch: ${{ github.ref_name }}"

          echo "✅ Created tag: v${VERSION}"

      - name: 📊 Generate release metrics
        run: |
          echo "## 📊 Release Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count files
          TOTAL_FILES=$(find docs -type f | wc -l)
          echo "- **Total Files in docs/:** ${TOTAL_FILES}" >> $GITHUB_STEP_SUMMARY

          HTML_FILES=$(find docs -name "*.html" | wc -l)
          echo "- **HTML Files:** ${HTML_FILES}" >> $GITHUB_STEP_SUMMARY

          CSS_FILES=$(find docs -name "*.css" | wc -l)
          echo "- **CSS Files:** ${CSS_FILES}" >> $GITHUB_STEP_SUMMARY

          JS_FILES=$(find docs -name "*.js" | wc -l)
          echo "- **JavaScript Files:** ${JS_FILES}" >> $GITHUB_STEP_SUMMARY

          WORKFLOW_FILES=$(find .github/workflows -name "*.yml" | wc -l)
          echo "- **CI/CD Workflows:** ${WORKFLOW_FILES}" >> $GITHUB_STEP_SUMMARY

          # Count tests
          echo "- **Automated Tests:** 12" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✨ Features Delivered" >> $GITHUB_STEP_SUMMARY
          echo "- Landing page with project overview" >> $GITHUB_STEP_SUMMARY
          echo "- Complete form system (PI/MU, CII, RPC)" >> $GITHUB_STEP_SUMMARY
          echo "- Annexes A, B, C, F" >> $GITHUB_STEP_SUMMARY
          echo "- Automated validation and testing" >> $GITHUB_STEP_SUMMARY
          echo "- Security and accessibility scans" >> $GITHUB_STEP_SUMMARY
          echo "- Performance optimization" >> $GITHUB_STEP_SUMMARY
          echo "- Pull request validation" >> $GITHUB_STEP_SUMMARY

      - name: 📢 Notify release
        run: |
          echo "🎉 Release completed successfully!"
          echo ""
          echo "📦 Version: ${{ github.event.inputs.version || github.ref_name }}"
          echo "🌐 Site: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo ""
          echo "📊 Check release at:"
          echo "  https://github.com/${{ github.repository }}/releases"
