name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run tests
        run: |
          cd docs
          echo "Validando formulários HTML..."
          # Verificar se todos os formulários existem
          test -f formularios/formulario_pi_mu.html || exit 1
          test -f formularios/formulario_cii.html || exit 1
          test -f formularios/formulario_rpc.html || exit 1
          test -f anexos/anexo_a.html || exit 1
          test -f anexos/anexo_b.html || exit 1
          test -f anexos/anexo_c.html || exit 1
          test -f anexos/anexo_f.html || exit 1
          echo "✓ Todos os formulários encontrados"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
