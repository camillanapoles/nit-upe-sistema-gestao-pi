# GitHub Actions Workflow para Deploy do Mock System no GitHub Pages
# Branch Alvo: feature/mock-system-github-pages
# Deploy para Branch: gh-pages (configurado em GitHub Pages settings)

name: Deploy Mock System to GitHub Pages

on:
  push:
    branches: ["feature/mock-system-github-pages"]
  # Permite execução manual na aba Actions do GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install Dependencies
        run: |
          cd web-app
          npm ci

      - name: Build Next.js App (Static Export)
        run: |
          cd web-app
          npm run build
        env:
          # Força Next.js a ignorar erros de imagens (necessário para static export)
          NEXT_PUBLIC_GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Add .nojekyll File
        # Previne o GitHub Pages de processar arquivos com Jekyll (importante para Next.js)
        run: |
          touch web-app/out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Caminho da pasta gerada pelo Next.js (next.config.js define distDir como 'out')
          publish_dir: ./web-app/out
          # Branch onde os arquivos estáticos serão colocados
          publish_branch: gh-pages
